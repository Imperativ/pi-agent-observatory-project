<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Metallic Bronze Gradients -->
    <linearGradient id="bronze-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0cb68"/>
      <stop offset="35%" stop-color="#c59b27"/>
      <stop offset="70%" stop-color="#8a6715"/>
      <stop offset="100%" stop-color="#4d390a"/>
    </linearGradient>
    <radialGradient id="ring-grad" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#0d140e"/>
      <stop offset="85%" stop-color="#1b2a1e"/>
      <stop offset="100%" stop-color="#c59b27"/>
    </radialGradient>
    <radialGradient id="sensor-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#00ff41"/>
      <stop offset="70%" stop-color="#008f26"/>
      <stop offset="100%" stop-color="rgba(0,255,65,0)"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer HUD Calibration Ring -->
  <circle cx="100" cy="100" r="97" fill="none" stroke="#6d5415" stroke-width="1" stroke-dasharray="2 6"/>
  <circle cx="100" cy="100" r="93" fill="none" stroke="#00ff41" stroke-width="0.8" opacity="0.4" stroke-dasharray="8 4 2 4"/>

  <!-- Cog Wheel (16 Teeth) -->
  <g fill="url(#bronze-grad)" stroke="#2b2005" stroke-width="1.5" stroke-linejoin="round">
    <!-- Base Gear Ring -->
    <path d="
      M 94 6 L 106 6 L 107 20 A 82 82 0 0 1 127 24 L 136 13 L 145 22 L 134 31 A 82 82 0 0 1 148 51 L 162 52 L 162 64 L 148 65 A 82 82 0 0 1 144 85 L 155 94 L 146 103 L 137 92 A 82 82 0 0 1 117 96 L 116 110 L 104 110 L 103 96 A 82 82 0 0 1 83 92 L 74 103 L 65 94 L 76 85 A 82 82 0 0 1 72 65 L 58 64 L 58 52 L 72 51 A 82 82 0 0 1 86 31 L 75 22 L 84 13 L 93 24 A 82 82 0 0 1 94 6 Z
    " transform="translate(10, 42) scale(0.9)"/>
  </g>

  <!-- Canonical 16-Tooth Opus Machina Gear Path -->
  <path d="
    M 93 8 L 107 8 L 107 22 A 78 78 0 0 1 128 26 L 138 16 L 148 26 L 138 36 A 78 78 0 0 1 152 57 L 166 57 L 166 71 L 152 71 A 78 78 0 0 1 148 92 L 158 102 L 148 112 L 138 102 A 78 78 0 0 1 117 116 L 117 130 L 103 130 L 103 116 A 78 78 0 0 1 82 112 L 72 122 L 62 112 L 72 102 A 78 78 0 0 1 58 81 L 44 81 L 44 67 L 58 67 A 78 78 0 0 1 62 46 L 52 36 L 62 26 L 72 36 A 78 78 0 0 1 93 22 Z
  " fill="url(#bronze-grad)" stroke="#3d2a06" stroke-width="1.5" transform="rotate(11.25 100 100)"/>

  <!-- Inner Dark Void Disc -->
  <circle cx="100" cy="100" r="66" fill="url(#ring-grad)" stroke="#c59b27" stroke-width="2"/>
  <circle cx="100" cy="100" r="60" fill="none" stroke="#00ff41" stroke-width="1" opacity="0.6" stroke-dasharray="6 3"/>

  <!-- Rivets around inner bezel -->
  <circle cx="100" cy="38" r="2" fill="#c59b27"/>
  <circle cx="144" cy="56" r="2" fill="#c59b27"/>
  <circle cx="162" cy="100" r="2" fill="#c59b27"/>
  <circle cx="144" cy="144" r="2" fill="#c59b27"/>
  <circle cx="100" cy="162" r="2" fill="#c59b27"/>
  <circle cx="56" cy="144" r="2" fill="#c59b27"/>
  <circle cx="38" cy="100" r="2" fill="#c59b27"/>
  <circle cx="56" cy="56" r="2" fill="#c59b27"/>

  <!-- ADEPTUS MECHANICUS SKULL (Left Bone / Right Cybernetic) -->
  <g transform="translate(100, 96) scale(0.95)">
    <!-- Central Divider / Spine Axis -->
    <!-- LEFT SIDE: Human Bone Skull -->
    <path d="
      M 0 -48
      C -26 -48 -46 -28 -46 2
      C -46 16 -40 26 -32 30
      C -34 35 -34 46 -30 48
      C -28 50 -18 50 -16 48
      L -16 40 L -6 40 L -6 48 L 0 48
      Z
    " fill="#d9ceb2" stroke="#6d5415" stroke-width="1.5"/>

    <!-- Left Eye Socket (Bone) -->
    <ellipse cx="-18" cy="-6" rx="10" ry="13" fill="#050705" stroke="#3d2a06" stroke-width="1.2"/>
    <!-- Left Nasal Cavity -->
    <path d="M -2 12 L -7 20 L -2 22 Z" fill="#050705"/>

    <!-- Left Teeth (Upper & Lower) -->
    <rect x="-14" y="32" width="5" height="7" fill="#d9ceb2" stroke="#6d5415" stroke-width="0.8"/>
    <rect x="-8" y="32" width="5" height="7" fill="#d9ceb2" stroke="#6d5415" stroke-width="0.8"/>
    <rect x="-2" y="32" width="3" height="7" fill="#d9ceb2" stroke="#6d5415" stroke-width="0.8"/>

    <!-- RIGHT SIDE: Cybernetic Mechanicus Cogitator (Metallic Bronze & Iron) -->
    <path d="
      M 0 -48
      C 26 -48 46 -28 46 2
      C 46 16 40 26 32 30
      C 34 35 34 46 30 48
      C 28 50 18 50 16 48
      L 16 40 L 6 40 L 6 48 L 0 48
      Z
    " fill="#2b332c" stroke="#c59b27" stroke-width="1.5"/>

    <!-- Cyber Cranial Plate Armor & Rivets -->
    <path d="M 0 -42 C 18 -42 34 -32 38 -14 L 14 -10 L 0 -22 Z" fill="#1b241c" stroke="#c59b27" stroke-width="1"/>
    <circle cx="8" cy="-36" r="1.5" fill="#c59b27"/>
    <circle cx="22" cy="-30" r="1.5" fill="#c59b27"/>
    <circle cx="32" cy="-18" r="1.5" fill="#c59b27"/>

    <!-- Cybernetic Ocular Implant (Bionic Sensor Eye) -->
    <circle cx="18" cy="-6" r="13" fill="#050705" stroke="#c59b27" stroke-width="2"/>
    <circle cx="18" cy="-6" r="9" fill="#142617" stroke="#00ff41" stroke-width="1"/>
    <!-- Ocular Aperture Ticks -->
    <line x1="18" y1="-15" x2="18" y2="-12" stroke="#00ff41" stroke-width="1.5"/>
    <line x1="18" y1="0" x2="18" y2="3" stroke="#00ff41" stroke-width="1.5"/>
    <line x1="9" y1="-6" x2="12" y2="-6" stroke="#00ff41" stroke-width="1.5"/>
    <line x1="24" y1="-6" x2="27" y2="-6" stroke="#00ff41" stroke-width="1.5"/>
    <!-- Glowing Sensor Core -->
    <circle cx="18" cy="-6" r="4.5" fill="url(#sensor-glow)" filter="url(#glow)"/>
    <circle cx="18" cy="-6" r="2" fill="#ffffff"/>

    <!-- Right Steel Jaw & Bolted Teeth -->
    <rect x="0" y="32" width="4" height="7" fill="#c59b27" stroke="#1b241c" stroke-width="0.8"/>
    <rect x="5" y="32" width="5" height="7" fill="#c59b27" stroke="#1b241c" stroke-width="0.8"/>
    <rect x="11" y="32" width="5" height="7" fill="#c59b27" stroke="#1b241c" stroke-width="0.8"/>

    <!-- Cybernetic Conduits / Cables -->
    <path d="M 28 16 C 36 22 36 32 30 40" fill="none" stroke="#c59b27" stroke-width="2.5" stroke-dasharray="2 1"/>
    <path d="M 34 8 C 42 16 42 28 34 36" fill="none" stroke="#00ff41" stroke-width="1.2" opacity="0.8"/>

    <!-- Center Seam (Holy Union of Flesh and Steel) -->
    <line x1="0" y1="-48" x2="0" y2="48" stroke="#c59b27" stroke-width="1.8"/>
  </g>

  <!-- Bottom Arch Inscription: 01001111 01001101 -->
  <path id="sub-arch" d="M 50 148 A 60 60 0 0 0 150 148" fill="none"/>
  <text font-family="'Share Tech Mono', monospace" font-size="7" fill="#00ff41" letter-spacing="2" opacity="0.85">
    <textPath href="#sub-arch" startOffset="50%" text-anchor="middle">
      OPUS MACHINAE // 01001111
    </textPath>
  </text>
</svg>
