<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="360" height="260">
  <defs>
    <filter id="skull-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g stroke="#00ff41" stroke-linecap="round" stroke-linejoin="round" filter="url(#skull-glow)">
    <!-- GRID AXES -->
    <line x1="20" y1="130" x2="340" y2="130" stroke="#008f26" stroke-width="0.5" stroke-dasharray="2 6" opacity="0.4"/>
    <line x1="180" y1="20" x2="180" y2="240" stroke="#008f26" stroke-width="0.5" stroke-dasharray="2 6" opacity="0.4"/>

    <!-- CRANIAL COGITATOR SHELL PROFILE (Side View Wireframe) -->
    <!-- Cranial Dome / Armor Shell -->
    <path d="
      M 95 180
      L 95 145
      C 95 90, 135 45, 195 45
      C 255 45, 290 85, 290 135
      C 290 155, 280 175, 265 190
      L 245 190
      L 240 215
      L 215 215
      L 210 190
      L 170 190
      L 165 215
      L 140 215
      L 135 180
      Z
    " fill="rgba(0, 255, 65, 0.03)" stroke="#00ff41" stroke-width="1.8"/>

    <!-- Cranial Internal Subdivisions & Cortex Matrix -->
    <path d="M 125 145 C 135 95, 175 75, 220 75 C 260 75, 275 105, 275 145" fill="none" stroke="#008f26" stroke-width="1.2" stroke-dasharray="6 3"/>
    <path d="M 145 145 C 150 110, 180 95, 215 95 C 245 95, 255 115, 258 145" fill="none" stroke="#008f26" stroke-width="0.8"/>

    <!-- CYBERNETIC OCULAR BARREL & TARGETING SIGHT (Facing Left) -->
    <rect x="52" y="115" width="45" height="26" rx="2" fill="rgba(0, 255, 65, 0.08)" stroke="#00ff41" stroke-width="1.5"/>
    <line x1="75" y1="115" x2="75" y2="141" stroke="#00ff41" stroke-width="1"/>
    <!-- Sensor Aperture Crosshair -->
    <circle cx="95" cy="128" r="18" fill="none" stroke="#00ff41" stroke-width="1.2"/>
    <circle cx="95" cy="128" r="9" fill="rgba(0, 255, 65, 0.2)" stroke="#f0cb68" stroke-width="1.4"/>
    <line x1="42" y1="128" x2="52" y2="128" stroke="#00ff41" stroke-width="2"/>
    <circle cx="40" cy="128" r="3" fill="#00ff41"/>

    <!-- Vector Sensor Mast / Antenna -->
    <line x1="210" y1="45" x2="225" y2="18" stroke="#00ff41" stroke-width="1.5"/>
    <circle cx="225" cy="18" r="2.5" fill="#f0cb68"/>
    <path d="M 215 15 C 225 10, 235 15, 240 22" fill="none" stroke="#00ff41" stroke-width="1" stroke-dasharray="2 2"/>

    <!-- Data Bus Couplings & Cables -->
    <path d="M 95 160 L 60 160 L 60 178 L 95 178" fill="rgba(0,255,65,0.05)" stroke="#00ff41" stroke-width="1.2"/>
    <line x1="68" y1="160" x2="68" y2="178" stroke="#f0cb68" stroke-width="1"/>
    <line x1="78" y1="160" x2="78" y2="178" stroke="#f0cb68" stroke-width="1"/>
    <line x1="88" y1="160" x2="88" y2="178" stroke="#f0cb68" stroke-width="1"/>

    <!-- Angle Measurement Arc (120°) -->
    <path d="M 195 128 L 245 88" stroke="#00ff41" stroke-width="0.8" stroke-dasharray="3 2"/>
    <path d="M 195 128 L 260 148" stroke="#00ff41" stroke-width="0.8" stroke-dasharray="3 2"/>
    <path d="M 225 104 A 36 36 0 0 1 234 140" fill="none" stroke="#f0cb68" stroke-width="1"/>
    <text x="242" y="122" font-family="'Share Tech Mono', monospace" font-size="8" fill="#f0cb68">120.0°</text>

    <!-- Dimension & Callout Lines -->
    <polyline points="95,115 110,80 150,80" fill="none" stroke="#00ff41" stroke-width="0.8"/>
    <circle cx="95" cy="115" r="2" fill="#00ff41"/>

    <polyline points="210,45 250,30 300,30" fill="none" stroke="#00ff41" stroke-width="0.8"/>
    <circle cx="210" cy="45" r="2" fill="#00ff41"/>

    <polyline points="290,135 315,135 330,155" fill="none" stroke="#00ff41" stroke-width="0.8"/>
    <circle cx="290" cy="135" r="2" fill="#00ff41"/>
  </g>

  <!-- LABELS & DATA -->
  <g font-family="'Share Tech Mono', monospace" fill="#00ff41" font-size="8.5" letter-spacing="1">
    <text x="155" y="78" opacity="0.95">VECTOR SENSORS // RETICLE</text>
    <text x="155" y="88" fill="#008f26" font-size="7">CALIBRATION: ACTIVE · TOL: 0.001</text>

    <text x="260" y="26" fill="#f0cb68" font-size="7.5">CRANIAL BUS 0x8FA4</text>
    <text x="275" y="170" fill="#008f26" font-size="7">SYNAPSE FLUX: 99.4%</text>

    <!-- Binary Cluster -->
    <text x="20" y="210" font-size="7" fill="#008f26">01010011 10110001</text>
    <text x="20" y="222" font-size="7" fill="#008f26">01101010 01101010</text>
    <text x="20" y="234" font-size="7" fill="#008f26">01100001 01101100</text>
  </g>
</svg>
