<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <filter id="green-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#00ff41"/>
    </marker>
  </defs>

  <g stroke="#00ff41" stroke-linecap="round" stroke-linejoin="round" filter="url(#green-glow)">
    <!-- GRID & HUD REFERENCE AXES -->
    <line x1="20" y1="160" x2="380" y2="160" stroke="#008f26" stroke-width="0.5" stroke-dasharray="4 8" opacity="0.4"/>
    <line x1="180" y1="20" x2="180" y2="300" stroke="#008f26" stroke-width="0.5" stroke-dasharray="4 8" opacity="0.4"/>

    <!-- OUTER HUD TARGET CIRCLE (Large Gear) -->
    <circle cx="160" cy="170" r="110" fill="none" stroke="#00ff41" stroke-width="0.8" stroke-dasharray="2 6" opacity="0.5"/>
    <circle cx="160" cy="170" r="95" fill="none" stroke="#008f26" stroke-width="0.6" stroke-dasharray="16 4 4 4" opacity="0.6"/>

    <!-- Ticks on Outer Ring -->
    <path d="
      M 160 56 L 160 62 M 160 278 L 160 284
      M 46 170 L 52 170 M 268 170 L 274 170
      M 79 89 L 83 93 M 237 247 L 241 251
      M 79 251 L 83 247 M 237 93 L 241 89
    " stroke="#00ff41" stroke-width="1.2"/>

    <!-- GEAR 1: MAIN DRIVE COG (Center at 160, 170, radius ~72) -->
    <!-- Pitch Circle -->
    <circle cx="160" cy="170" r="70" fill="rgba(0, 255, 65, 0.03)" stroke="#00ff41" stroke-width="1.5"/>
    <circle cx="160" cy="170" r="54" fill="none" stroke="#008f26" stroke-width="1"/>
    <circle cx="160" cy="170" r="28" fill="none" stroke="#00ff41" stroke-width="1.2"/>
    <circle cx="160" cy="170" r="10" fill="rgba(0, 255, 65, 0.2)" stroke="#00ff41" stroke-width="1.8"/>

    <!-- Gear 1 Teeth (12 Teeth) -->
    <g transform="translate(160, 170)" stroke="#00ff41" stroke-width="1.6" fill="rgba(0,255,65,0.06)">
      <!-- 12 teeth generated by rotation -->
      <path d="M -7 -70 L -5 -82 L 5 -82 L 7 -70 Z"/>
      <path d="M -7 -70 L -5 -82 L 5 -82 L 7 -70 Z" transform="rotate(30)"/>
      <path d="M -7 -70 L -5 -82 L 5 -82 L 7 -70 Z" transform="rotate(60)"/>
      <path d="M -7 -70 L -5 -82 L 5 -82 L 7 -70 Z" transform="rotate(90)"/>
      <path d="M -7 -70 L -5 -82 L 5 -82 L 7 -70 Z" transform="rotate(120)"/>
      <path d="M -7 -70 L -5 -82 L 5 -82 L 7 -70 Z" transform="rotate(150)"/>
      <path d="M -7 -70 L -5 -82 L 5 -82 L 7 -70 Z" transform="rotate(180)"/>
      <path d="M -7 -70 L -5 -82 L 5 -82 L 7 -70 Z" transform="rotate(210)"/>
      <path d="M -7 -70 L -5 -82 L 5 -82 L 7 -70 Z" transform="rotate(240)"/>
      <path d="M -7 -70 L -5 -82 L 5 -82 L 7 -70 Z" transform="rotate(270)"/>
      <path d="M -7 -70 L -5 -82 L 5 -82 L 7 -70 Z" transform="rotate(300)"/>
      <path d="M -7 -70 L -5 -82 L 5 -82 L 7 -70 Z" transform="rotate(330)"/>

      <!-- Internal Spokes (4 Spokes) -->
      <line x1="0" y1="-28" x2="0" y2="-54" stroke-width="2"/>
      <line x1="0" y1="28" x2="0" y2="54" stroke-width="2"/>
      <line x1="-28" y1="0" x2="-54" y2="0" stroke-width="2"/>
      <line x1="28" y1="0" x2="54" y2="0" stroke-width="2"/>
    </g>

    <!-- GEAR 2: SECONDARY INTERLOCKING COG (Center at 265, 105, radius ~46) -->
    <circle cx="265" cy="105" r="44" fill="rgba(0, 255, 65, 0.03)" stroke="#00ff41" stroke-width="1.4"/>
    <circle cx="265" cy="105" r="32" fill="none" stroke="#008f26" stroke-width="0.8"/>
    <circle cx="265" cy="105" r="16" fill="none" stroke="#00ff41" stroke-width="1"/>
    <circle cx="265" cy="105" r="6" fill="rgba(0, 255, 65, 0.3)" stroke="#00ff41" stroke-width="1.5"/>

    <!-- Gear 2 Teeth (8 Teeth) -->
    <g transform="translate(265, 105) rotate(15)" stroke="#00ff41" stroke-width="1.5" fill="rgba(0,255,65,0.06)">
      <path d="M -6 -44 L -4 -54 L 4 -54 L 6 -44 Z"/>
      <path d="M -6 -44 L -4 -54 L 4 -54 L 6 -44 Z" transform="rotate(45)"/>
      <path d="M -6 -44 L -4 -54 L 4 -54 L 6 -44 Z" transform="rotate(90)"/>
      <path d="M -6 -44 L -4 -54 L 4 -54 L 6 -44 Z" transform="rotate(135)"/>
      <path d="M -6 -44 L -4 -54 L 4 -54 L 6 -44 Z" transform="rotate(180)"/>
      <path d="M -6 -44 L -4 -54 L 4 -54 L 6 -44 Z" transform="rotate(225)"/>
      <path d="M -6 -44 L -4 -54 L 4 -54 L 6 -44 Z" transform="rotate(270)"/>
      <path d="M -6 -44 L -4 -54 L 4 -54 L 6 -44 Z" transform="rotate(315)"/>
    </g>

    <!-- GEAR 3: TERTIARY PINION (Center at 270, 195, radius ~24) -->
    <circle cx="270" cy="195" r="22" fill="rgba(0, 255, 65, 0.04)" stroke="#00ff41" stroke-width="1.2"/>
    <circle cx="270" cy="195" r="8" fill="rgba(0, 255, 65, 0.3)" stroke="#00ff41" stroke-width="1.2"/>
    <g transform="translate(270, 195) rotate(8)" stroke="#00ff41" stroke-width="1.2" fill="rgba(0,255,65,0.08)">
      <path d="M -4 -22 L -3 -29 L 3 -29 L 4 -22 Z"/>
      <path d="M -4 -22 L -3 -29 L 3 -29 L 4 -22 Z" transform="rotate(60)"/>
      <path d="M -4 -22 L -3 -29 L 3 -29 L 4 -22 Z" transform="rotate(120)"/>
      <path d="M -4 -22 L -3 -29 L 3 -29 L 4 -22 Z" transform="rotate(180)"/>
      <path d="M -4 -22 L -3 -29 L 3 -29 L 4 -22 Z" transform="rotate(240)"/>
      <path d="M -4 -22 L -3 -29 L 3 -29 L 4 -22 Z" transform="rotate(300)"/>
    </g>

    <!-- TECHNICAL DIMENSION LINES & CALLOUT ARROWS -->
    <!-- Dimension for Gear 1 -->
    <line x1="88" y1="88" x2="35" y2="45" stroke="#00ff41" stroke-width="0.8"/>
    <line x1="35" y1="45" x2="15" y2="45" stroke="#00ff41" stroke-width="0.8"/>
    <!-- Dimension for Gear 2 -->
    <line x1="305" y1="75" x2="345" y2="45" stroke="#00ff41" stroke-width="0.8"/>
    <line x1="345" y1="45" x2="385" y2="45" stroke="#00ff41" stroke-width="0.8"/>
    <!-- Mesh Interface Callout -->
    <path d="M 218 138 L 245 155 L 290 155" fill="none" stroke="#00ff41" stroke-width="0.8"/>
    <circle cx="218" cy="138" r="3" fill="#00ff41"/>

    <!-- Bottom Alignment Bar & Caliper -->
    <line x1="160" y1="285" x2="270" y2="285" stroke="#00ff41" stroke-width="0.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="160" y1="275" x2="160" y2="295" stroke="#00ff41" stroke-width="0.8"/>
    <line x1="270" y1="275" x2="270" y2="295" stroke="#00ff41" stroke-width="0.8"/>
  </g>

  <!-- TECHNICAL LABELS & BINARY ANNOTATIONS -->
  <g font-family="'Share Tech Mono', monospace" fill="#00ff41" font-size="8.5" letter-spacing="1">
    <text x="18" y="38" opacity="0.9">COG-ALPHA // Ø 84.2mm</text>
    <text x="18" y="48" fill="#008f26" font-size="7">TEETH: 12 · MOD: 7.0</text>

    <text x="295" y="38" opacity="0.9">COG-BETA // Ø 42.1mm</text>
    <text x="295" y="48" fill="#008f26" font-size="7">RATIO: 1:2.4 · SYNC OK</text>

    <text x="295" y="152" font-size="7.5" fill="#f0cb68">INTERMESH TOL: ±0.002</text>

    <text x="215" y="280" font-size="7" text-anchor="middle">Δ AXIS: 110.0mm</text>

    <!-- Floating Binary Cluster -->
    <text x="20" y="285" font-size="6.5" fill="#008f26" opacity="0.7">01010011 01000011</text>
    <text x="20" y="295" font-size="6.5" fill="#008f26" opacity="0.7">10110001 01100101</text>
  </g>
</svg>
