<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="bracket-bronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0cb68"/>
      <stop offset="40%" stop-color="#c59b27"/>
      <stop offset="80%" stop-color="#6d5415"/>
      <stop offset="100%" stop-color="#3d2a06"/>
    </linearGradient>
  </defs>
  <!-- 90-degree outer corner with 45-degree inner chamfer -->
  <polygon points="0,0 40,0 40,8 14,8 8,14 8,40 0,40" fill="url(#bracket-bronze)" stroke="#2b2005" stroke-width="1"/>
  <!-- Corner Bolt / Rivet -->
  <circle cx="16" cy="16" r="3.5" fill="#f0cb68" stroke="#332204" stroke-width="1"/>
  <circle cx="16" cy="16" r="1.5" fill="#332204"/>
  <!-- Decorative Ticks -->
  <line x1="24" y1="4" x2="36" y2="4" stroke="#00ff41" stroke-width="0.8"/>
  <line x1="4" y1="24" x2="4" y2="36" stroke="#00ff41" stroke-width="0.8"/>
</svg>
